name: android
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: android, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK + unit tests
        id: build
        continue-on-error: true
        run: |
          mkdir -p out
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest assembleDebugAndroidTest 2>&1 | tee out/build.log

      - name: Collect build outputs
        if: always()
        run: |
          echo "build=${{ steps.build.outcome }}" > out/status.txt
          cp app/build/outputs/apk/debug/app-debug.apk out/CabFusion-debug.apk 2>/dev/null || true
          mkdir -p out/unit && cp -r app/build/test-results/testDebugUnitTest/*.xml out/unit/ 2>/dev/null || true

      - name: Enable KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator screenshot flow
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon connectedDebugAndroidTest > out/connected.log 2>&1 || echo "connected tests failed" >> out/status.txt
            mkdir -p out/screens && adb pull /data/local/tmp/cf/. out/screens/ || true
            adb logcat -d -v time > out/logcat.txt 2>&1 || true
            cp -r app/build/outputs/androidTest-results out/androidTest-results 2>/dev/null || true

      - name: Publish results to ci-results branch
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b ci-results
          echo "${GITHUB_SHA}" > commit.txt
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "ci ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
